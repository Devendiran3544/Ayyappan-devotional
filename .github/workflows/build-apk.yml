name: Build Sabarimala Yatra Guide V2 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract V2 Android project archive
        run: unzip -o SabarimalaYatraGuide_V2_SourceCode.zip -d project
      - name: Repair Kotlin lyrics string (RCA fix)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('project/app/src/main/java/com/sabarimala/yatraguide/data/SongLibraryRepository.kt')
          s = p.read_text(encoding='utf-8')
          pattern = r'lyricsTa = "சுவாமியே சரணம் ஐயப்பா![\\s\\S]*?\\$cleanTitle",'
          replacement = 'lyricsTa = "சுவாமியே சரணம் ஐயப்பா!\\\\n\\\\n$cleanTitle",'
          s2, n = re.subn(pattern, replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'Expected to repair exactly 1 lyricsTa string, repaired {n}')
          p.write_text(s2, encoding='utf-8')
          print('Repaired malformed lyricsTa string.')
          PY
      - name: Diagnose source snippet
        run: sed -n '140,170p' project/app/src/main/java/com/sabarimala/yatraguide/data/SongLibraryRepository.kt
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: project
        run: gradle assembleDebug --stacktrace
      - name: Rename APK
        working-directory: project
        run: cp app/build/outputs/apk/debug/app-debug.apk ../SabarimalaYatraGuide-v2.0.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SabarimalaYatraGuide-V2-Installable-APK
          path: SabarimalaYatraGuide-v2.0.apk
          retention-days: 90
