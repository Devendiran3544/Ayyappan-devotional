name: Build Sabarimala Yatra Guide APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract Android project archive
        run: unzip -o SabarimalaYatraGuide_Android_APK_Project.zip -d project
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: project
        run: gradle assembleDebug --stacktrace
      - name: Rename APK
        working-directory: project
        run: cp app/build/outputs/apk/debug/app-debug.apk ../SabarimalaYatraGuide-v1.0.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SabarimalaYatraGuide-Installable-APK
          path: SabarimalaYatraGuide-v1.0.apk
          retention-days: 90
