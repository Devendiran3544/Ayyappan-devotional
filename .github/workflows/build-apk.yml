name: Build & Test Sabarimala Yatra Guide V2.2 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract V2.2 audited source
        run: unzip -o SabarimalaYatraGuide_V2_2_Audited_Complete.zip -d project
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Run unit tests
        working-directory: project
        run: gradle testDebugUnitTest --stacktrace
      - name: Build APK
        working-directory: project
        run: gradle assembleDebug --stacktrace
      - name: Rename APK
        working-directory: project
        run: cp app/build/outputs/apk/debug/app-debug.apk ../SabarimalaYatraGuide-v2.2.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SabarimalaYatraGuide-V2.2-APK
          path: SabarimalaYatraGuide-v2.2.0.apk
          retention-days: 90
